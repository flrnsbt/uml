name: uml
description: >-
  Generate PlantUML and Mermaid diagram URLs with customizable themes, colors, and styling. Supports downloading and saving diagrams as SVG, PNG, WebP, or JPEG.
version: 1.0.2
repository: https://github.com/flrnsbt/uml
topics:
- diagram
- plantuml
- mermaid
- uml
- visualization

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  archive: '>=3.6.1 <5.0.0'
  path: ^1.9.0
  web: '>=0.5.1 <2.0.0'

dev_dependencies:
  lints: '>=5.0.0 <7.0.0'
  test: ^1.25.0
